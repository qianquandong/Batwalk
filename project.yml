# XcodeGen spec — generates Batwalk.xcodeproj (which is git-ignored).
#   brew install xcodegen && xcodegen generate && open Batwalk.xcodeproj
# Set your Apple Developer Team once in Config/Local.xcconfig (see README).
name: Batwalk

options:
  bundleIdPrefix: com.aimanjack
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Full concurrency checking as warnings while still in the Swift 5 language
    # mode; flip SWIFT_VERSION to 6.0 once a Mac build shows the warnings are gone.
    SWIFT_STRICT_CONCURRENCY: complete
    # String Catalog: Xcode extracts every SwiftUI/Text literal into
    # Apps/Shared/Localizable.xcstrings at build time, ready for translation.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "19"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    BATWALK_APP_GROUP_ENABLED: "NO"
    BATWALK_CLOUD_BACKUP_ENABLED: "NO"
    BATWALK_GAME_CENTER_ENABLED: "NO"
    # Roster waves (open question Q12): 1 = launch roster (#1–20),
    # 2 = + Oddball Bats (#21–32) for the first content update.
    BATWALK_CONTENT_WAVE: "1"
    # TelemetryDeck app ID for anonymous game-event analytics (docs/ANALYTICS.md).
    # Empty = analytics completely off (the no-op sink).
    BATWALK_TELEMETRYDECK_APP_ID: ""

packages:
  BatwalkCore:
    path: Packages/BatwalkCore
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.0.0"

targets:
  # ── Apple Watch: the game ─────────────────────────────────────────────
  BatwalkWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/Watch
      - Apps/Shared
    dependencies:
      - package: BatwalkCore
      - package: TelemetryDeck
        product: TelemetryDeck
      - target: BatwalkComplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimanjack.batwalk.watchkitapp
        PRODUCT_NAME: Batwalk
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: Batwalk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        BatwalkAppGroupEnabled: "$(BATWALK_APP_GROUP_ENABLED)"
        BatwalkCloudBackupEnabled: "$(BATWALK_CLOUD_BACKUP_ENABLED)"
        BatwalkContentWave: "$(BATWALK_CONTENT_WAVE)"
        BatwalkTelemetryDeckAppID: "$(BATWALK_TELEMETRYDECK_APP_ID)"
        WKCompanionAppBundleIdentifier: com.aimanjack.batwalk
        WKRunsIndependentlyOfCompanionApp: true
        NSHealthShareUsageDescription: "Your steps hatch your bat. Batwalk reads only Step Count. Walk details stay on your devices unless you choose to include them in a shared card."
        NSHealthUpdateUsageDescription: "Batwalk never writes to Health. It only reads your Step Count so your steps can hatch your bat."
    entitlements:
      path: Apps/Watch/BatwalkWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        # Enable using scripts/configure-capabilities.py after portal registration
        # (docs/SIGNING.md). Runtime flags and entitlements are generated together:
        # com.apple.developer.icloud-container-identifiers: [iCloud.com.aimanjack.batwalk]
        # com.apple.developer.icloud-services: [CloudKit]
        # com.apple.security.application-groups: [group.com.aimanjack.batwalk]
        # aps-environment: development
    scheme:
      testTargets: []

  # ── Watch complication (WidgetKit) ────────────────────────────────────
  BatwalkComplication:
    type: app-extension
    platform: watchOS
    sources:
      # Apps/Complication/Assets.xcassets holds the 32 portraits + egg states the
      # face shows (≈450 KB), so the extension never links the full sprite set.
      - Apps/Complication
      - Apps/Shared/ComplicationSnapshot.swift
      - Apps/Shared/SharedConfig.swift
      - Apps/Shared/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimanjack.batwalk.watchkitapp.widget
        PRODUCT_NAME: BatwalkComplication
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: Apps/Complication/Info.plist
      properties:
        CFBundleDisplayName: Batwalk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BatwalkAppGroupEnabled: "$(BATWALK_APP_GROUP_ENABLED)"
    # entitlements (re-enable with the App Group — docs/SIGNING.md):
    #   com.apple.security.application-groups: [group.com.aimanjack.batwalk]

  # ── iPhone companion: Batpedia, history, purchase ─────────────────────
  BatwalkPhone:
    type: application
    platform: iOS
    sources:
      - Apps/Phone
      - path: Apps/Shared
        excludes: [PrivacyInfo.xcprivacy]
      - path: Config/Batwalk.storekit
        buildPhase: none
    dependencies:
      - package: BatwalkCore
      - package: TelemetryDeck
        product: TelemetryDeck
      - target: BatwalkWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimanjack.batwalk
        PRODUCT_NAME: Batwalk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Apps/Phone/Info.plist
      properties:
        CFBundleDisplayName: Batwalk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        BatwalkGameCenterEnabled: "$(BATWALK_GAME_CENTER_ENABLED)"
        NSGKFriendListUsageDescription: "See hatch counts from Game Center friends who also choose to connect with Batwalk. Steps are never shared with Game Center."
        BatwalkAppGroupEnabled: "$(BATWALK_APP_GROUP_ENABLED)"
        BatwalkCloudBackupEnabled: "$(BATWALK_CLOUD_BACKUP_ENABLED)"
        BatwalkContentWave: "$(BATWALK_CONTENT_WAVE)"
        BatwalkTelemetryDeckAppID: "$(BATWALK_TELEMETRYDECK_APP_ID)"
    # entitlements + UIBackgroundModes [remote-notification] come back with
    # iCloud / App Group (docs/SIGNING.md):
    #   com.apple.developer.icloud-container-identifiers: [iCloud.com.aimanjack.batwalk]
    #   com.apple.developer.icloud-services: [CloudKit]
    #   com.apple.security.application-groups: [group.com.aimanjack.batwalk]
    #   aps-environment: development
    scheme:
      storeKitConfiguration: Config/Batwalk.storekit
      testTargets: [BatwalkAppTests]

  BatwalkAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/Tests]
    dependencies:
      - target: BatwalkPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimanjack.batwalk.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Batwalk.app/Batwalk"
        BUNDLE_LOADER: "$(TEST_HOST)"

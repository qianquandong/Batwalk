name: TestFlight

# Builds the iPhone app (which carries the Watch app + complication), signs it
# in the cloud with an App Store Connect API key, and uploads it to TestFlight.
# No Mac needed: start it from the Actions tab (Run workflow) on any device,
# or push main's commit to a trigger branch:
#   git push -f origin main:testflight          → archive + upload
#   git push -f origin main:testflight-archive  → archive only (registers App IDs)
#
# Required repository secrets (Settings › Secrets and variables › Actions):
#   ASC_KEY_ID      Key ID of an App Store Connect API key with the Admin role
#   ASC_ISSUER_ID   Issuer ID shown above the key list
#   ASC_KEY_P8      Full text of the downloaded AuthKey_XXXX.p8 file
#                   (including the BEGIN/END PRIVATE KEY lines)

on:
  push:
    branches: [testflight, testflight-archive]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (off = only archive & sign, which also registers the App IDs)"
        type: boolean
        default: true
      build_number:
        description: "Build number greater than the latest TestFlight build (blank = GitHub run number)"
        type: string
        required: false
      runner:
        description: "Standard Mac runner pool (Intel is a fallback when Apple Silicon is queued)"
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive, sign, upload
    runs-on: ${{ inputs.runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      BATWALK_APP_GROUP: ${{ vars.BATWALK_APP_GROUP_ENABLED }}
      BATWALK_CLOUD_BACKUP: ${{ vars.BATWALK_CLOUD_BACKUP_ENABLED }}
      BATWALK_GAME_CENTER: ${{ vars.BATWALK_GAME_CENTER_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate build number
        run: |
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::Build number must be an integer from 1 to 9999"
            exit 1
          fi

      - name: Check secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "::error::ASC_KEY_P8 must be the full .p8 text including the BEGIN PRIVATE KEY line"; exit 1 ;;
          esac

      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Select Xcode 26+
        run: scripts/select-xcode.sh

      - name: Generate project
        run: |
          brew install xcodegen
          args=()
          [ "$BATWALK_APP_GROUP" != "true" ] || args+=(--app-group)
          [ "$BATWALK_CLOUD_BACKUP" != "true" ] || args+=(--cloud-backup)
          [ "$BATWALK_GAME_CENTER" != "true" ] || args+=(--game-center)
          python3 scripts/configure-capabilities.py "${args[@]}"
          xcodegen generate --spec project.capabilities.json

      - name: Test rules before archiving
        run: swift test --package-path Packages/BatwalkCore

      - name: Test application reliability before archiving
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkPhone \
            -destination "platform=iOS Simulator,id=$device" CODE_SIGNING_ALLOWED=NO test

      - name: Archive (ad-hoc signed; export re-signs for App Store — no test devices needed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          scripts/ci-xcodebuild.sh \
            -project Batwalk.xcodeproj \
            -scheme BatwalkPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Batwalk.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Verify embedded apps, privacy manifests and Watch Health entitlements
        run: |
          umask 077
          codesign -d --entitlements :- \
            "$RUNNER_TEMP/Batwalk.xcarchive/Products/Applications/Batwalk.app/Watch/Batwalk.app" \
            > "$RUNNER_TEMP/watch-entitlements.plist" \
            2> "$RUNNER_TEMP/watch-entitlements-diagnostics.log"
          python3 scripts/verify-testflight-archive.py "$RUNNER_TEMP/Batwalk.xcarchive" \
            --build-number "$BUILD_NUMBER" \
            --watch-entitlements "$RUNNER_TEMP/watch-entitlements.plist" \
            --report "$RUNNER_TEMP/archive-verification.json"

      - name: Verify archived Game Center entitlement scope
        run: python3 scripts/verify-game-center-archive.py "$RUNNER_TEMP/Batwalk.xcarchive"

      - name: Save sanitized archive verification
        uses: actions/upload-artifact@v4
        with:
          name: archive-verification
          path: ${{ runner.temp }}/archive-verification.json
          if-no-files-found: error

      - name: Export & upload to TestFlight
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || (github.event_name == 'push' && github.ref_name == 'testflight') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          scripts/ci-xcodebuild.sh \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Batwalk.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build $BUILD_NUMBER uploaded. It appears in TestFlight after Apple finishes processing (usually 5–20 min)."

      - name: Remove API key and private verification files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 \
            "$RUNNER_TEMP/watch-entitlements.plist" \
            "$RUNNER_TEMP/watch-entitlements-diagnostics.log"

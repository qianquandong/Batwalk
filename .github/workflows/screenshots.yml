name: Screenshots

# Runs the Watch app in the Apple Watch simulator and screenshots every
# DemoMode scenario. Results are force-pushed to the `screenshots-output`
# branch (screens/*.png) so they can be viewed on GitHub or fetched with git.
# Start: Actions › Screenshots › Run workflow, or push to the `screenshots` branch.

on:
  push:
    branches: [screenshots]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also replace screenshots-output (off = downloadable artifact only)"
        type: boolean
        default: false
      watch_only:
        description: "Capture only the Watch"
        type: boolean
        default: false
      watch_scenario:
        description: "Optional exact Watch scenario for a focused visual check"
        type: string
        default: ""
      watch_size:
        description: "Watch display size for layout review"
        type: choice
        options: [large, small]
        default: large

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: scripts/select-xcode.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Boot an Apple Watch simulator
        env:
          BATWALK_WATCH_SIZE: ${{ inputs.watch_size }}
        run: scripts/watch-sim.sh

      - name: Build Watch app for the simulator
        run: |
          scripts/ci-xcodebuild.sh \
            -project Batwalk.xcodeproj \
            -scheme BatwalkWatch \
            -configuration Debug \
            -destination "id=$SIM" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture Watch scenarios
        env:
          BATWALK_SCREEN_SCENARIO: ${{ inputs.watch_scenario }}
        run: scripts/capture-screens.sh watch "$RUNNER_TEMP/out/screens/watch"

      - name: Boot an iPhone simulator
        if: ${{ !inputs.watch_only }}
        run: scripts/phone-sim.sh

      - name: Build iPhone app for the simulator
        if: ${{ !inputs.watch_only }}
        run: |
          scripts/ci-xcodebuild.sh \
            -project Batwalk.xcodeproj \
            -scheme BatwalkPhone \
            -configuration Debug \
            -destination "id=$PHONE_SIM" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture iPhone scenarios
        if: ${{ !inputs.watch_only }}
        run: SIM="$PHONE_SIM" scripts/capture-screens.sh phone "$RUNNER_TEMP/out/screens/phone"

      - name: Save review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: batwalk-screenshots
          path: ${{ runner.temp }}/out/screens

      - name: Publish to screenshots-output branch
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/out"
          printf '# Watch screenshots\n\nFrom %s (%s)\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > README.md
          git init -q -b screenshots-output
          git config user.name "batwalk-ci"
          git config user.email "batwalk-ci@users.noreply.github.com"
          git add .
          git commit -qm "Watch screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots-output
          echo "::notice::Screenshots pushed to the screenshots-output branch"

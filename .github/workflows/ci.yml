name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The rules package is pure Swift and runs anywhere. Linux minutes bill at 1×
  # (macOS at 10×), so every pull request gets this check even on a tight plan.
  core-tests:
    name: BatwalkCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run game-rule tests
        run: swift test --package-path Packages/BatwalkCore

  script-tests:
    name: Release-script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CI fallback detection
        run: python3 -m unittest discover -s scripts/tests -p 'test_github_ci_fallback.py'

  # Simulator builds need macOS. They run for pushes to main and on demand;
  # pull requests are verified on Codemagic (codemagic.yaml) so GitHub's macOS
  # minutes are not spent on every push.
  build-apps:
    name: Build Watch + iPhone (simulator, unsigned)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26+
        run: scripts/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build Watch app
        run: |
          scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone app (embeds the Watch app)
        run: |
          scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkPhone \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test persistence and step reconciliation
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkPhone \
            -destination "platform=iOS Simulator,id=$device" \
            -resultBundlePath AppTests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Validate capability-enabled configuration (unsigned)
        run: |
          python3 scripts/configure-capabilities.py --app-group --cloud-backup
          xcodegen generate --spec project.capabilities.json
          scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkPhone \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Keep application test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: AppTests.xcresult

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: BatwalkCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26+
        run: scripts/select-xcode.sh
      - name: Swift version
        run: swift --version
      - name: Run game-rule tests
        run: swift test --package-path Packages/BatwalkCore

  build-apps:
    name: Build Watch + iPhone (simulator, unsigned)
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26+
        run: scripts/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build Watch app
        run: |
          scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone app (embeds the Watch app)
        run: |
          scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkPhone \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test persistence and step reconciliation
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkPhone \
            -destination "platform=iOS Simulator,id=$device" \
            CODE_SIGNING_ALLOWED=NO test

<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batwalk · 原图动作样板 01</title>
<style>
:root{color-scheme:light;--paper:#f5efdf;--ink:#304039;--muted:#748077;--line:#d9d8c4;--green:#435c49}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1420px;margin:auto;padding:36px 28px 60px}header{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:24px}.brand{font-weight:800;letter-spacing:.07em;font-size:17px}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--muted)}h1{font-size:clamp(25px,4vw,39px);line-height:1.25;letter-spacing:-.03em;margin:15px 0 10px}p{margin:8px 0}.intro{max-width:750px;color:#687268}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}button,a{font:inherit}button{border:1px solid #c8cfbd;background:#fcf9f0;color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer}button:hover,button:focus-visible{border-color:#536b4d;background:#ebefdf}button:focus-visible,a:focus-visible{outline:3px solid #a4b295;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#314937;color:white}.hint{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#fffdf5;border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;overflow:hidden}.card-head{display:flex;gap:10px;align-items:baseline}.num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}h2{font-size:22px;margin:0}.action{font-size:15px;margin:4px 0 0;color:#647552}.description{font-size:13px;color:var(--muted);min-height:44px;line-height:1.65}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:20px}.stage{min-width:0;text-align:center;border-radius:12px;background:#f3eedf;padding:10px 2px 8px}.stage.motion{background:#eaf0e2}.label{font-size:11px;letter-spacing:.04em;color:#737c6c}.large{display:block;width:100%;max-width:210px;height:auto;margin:4px auto;image-rendering:pixelated}.small-mode .large{width:96px;max-width:100%;margin:30px auto}.phase{font-size:12px;margin-top:12px;color:#67775c;min-height:24px}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.frame{padding:3px;border:1px solid #e4e3d7;border-radius:7px;background:transparent;min-width:0}.frame[aria-pressed="true"]{border-color:#80916d;background:#edf2e5}.frame canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.frame span{font-size:10px;color:#697260}.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:15px}.foot a{color:#5b7351;text-underline-offset:3px}.badge{font-size:11px;background:#f4ecd5;color:#857044;padding:4px 8px;border-radius:99px}footer{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.9}#error{background:#f9dfd8;color:#852f1e;padding:16px;border-radius:8px} @media(max-width:1000px){.grid{grid-template-columns:1fr}.card{max-width:600px;width:100%;margin:auto}.description{min-height:0}.large{max-width:200px}main{padding:24px 18px}.frames canvas{max-height:116px;width:auto;max-width:100%;margin:auto}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main>
<header><div class="brand">BATWALK <span class="eyebrow"> / CHARACTER MOTION · 01</span></div>
<h1>让熟悉的它们，动起来。</h1>
<p class="intro">左边是你确认的原立绘，右边是新做的四帧动作样板。先看角色有没有变样，再看小动作像不像它的性格。</p>
<div class="toolbar"><button id="play" class="primary">暂停动作</button><button id="next">逐帧查看 →</button><button id="size">缩小预览 · 96 px</button><span class="hint">点击下方任意一帧可停住对照</span></div></header>
<div id="error" hidden></div><section id="cards" class="grid" aria-label="三只角色的原图与动作对照"></section>
<footer>本轮仅制作 3 只 × 1 个动作，共 12 个关键姿态。动作来自原设计表；这些是待确认样板，尚未接入游戏。<br>原始立绘与生成帧表均保留不变。确认角色一致性和动作方向后，再细修循环并扩展首发 20 只。</footer>
</main>
<script>
const notes={
'long-ear':{number:'03',summary:'听见叶子上的脚步，身体停住，大耳朵悄悄转过去。',phases:['发现小瓢虫','耳朵转向声音','屏息仔细听','耳朵慢慢回位']},
'fruit':{number:'04',summary:'左右瞄一眼，把梨抱得更紧，最后安心地眯起眼。',phases:['抱着自己的梨','先看看左边','再看看右边','安心抱紧']},
'moonwing':{number:'15',summary:'抬头看光，藏进月牙翅膀里，再小心露出眼睛。',phases:['窝在月牙里','偷偷抬头看','缩进翅膀里','又忍不住探头']}};
let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches, tick=performance.now(), models=[], step=0;
const play=document.querySelector('#play');
function setPlay(value){playing=value;tick=performance.now();play.textContent=playing?'暂停动作':'播放动作';}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('无法加载 '+src));im.src=src;});}
function draw(canvas,image,frame,height){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,256,280);ctx.imageSmoothingEnabled=false;const scale=226/height;const [x,y,w,h]=frame.rect;ctx.drawImage(image,x,y,w,h,128-frame.anchor[0]*scale,258-frame.anchor[1]*scale,w*scale,h*scale);}
function paint(model){draw(model.canvas,model.image,model.data.frames[model.index],model.height);model.phase.textContent=`${model.index+1} / 4 · ${notes[model.data.id].phases[model.index]}`;model.buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===model.index)));}
async function init(){const response=await fetch('manifest.json');if(!response.ok)throw new Error('无法读取样板清单');const manifest=await response.json();
for(const data of manifest.characters){const n=notes[data.id];const card=document.createElement('article');card.className='card';card.dataset.character=data.id;card.innerHTML=`<div class="card-head"><span class="num">${n.number}</span><h2>${data.name}</h2></div><p class="action">${data.title}</p><p class="description">${n.summary}</p><div class="comparison"><div class="stage"><div class="label">已确认 · 原立绘</div><canvas class="large original" width="256" height="280" role="img" aria-label="${data.name}原立绘"></canvas></div><div class="stage motion"><div class="label">动作样板 · 4 帧</div><canvas class="large animated" width="256" height="280" role="img" aria-label="${data.name}${data.title}动作"></canvas></div></div><div class="phase"></div><div class="frames">${n.phases.map((p,i)=>`<button class="frame" aria-label="第${i+1}帧：${p}" aria-pressed="${i===0}"><canvas width="256" height="280"></canvas><span>0${i+1}</span></button>`).join('')}</div><div class="foot"><span class="badge">待你确认</span><a href="${data.sheet}" target="_blank" rel="noopener">查看完整帧表 ↗</a></div>`;document.querySelector('#cards').append(card);
const [original,image]=await Promise.all([loadImage(data.portrait),loadImage(data.sheet)]);const height=Math.max(...data.frames.map(f=>f.bbox[3]-f.bbox[1]));draw(card.querySelector('.original'),original,data.original,data.original.bbox[3]-data.original.bbox[1]);const buttons=[...card.querySelectorAll('.frame')];const model={data,image,height,index:0,canvas:card.querySelector('.animated'),phase:card.querySelector('.phase'),buttons,elapsed:0};buttons.forEach((b,i)=>{draw(b.querySelector('canvas'),image,data.frames[i],height);b.addEventListener('click',()=>{setPlay(false);model.index=i;model.elapsed=0;paint(model);});});models.push(model);paint(model);
}window.reviewReady=true;setPlay(playing);requestAnimationFrame(loop);}
function loop(now){const dt=Math.min(now-tick,100);tick=now;if(playing){models.forEach(m=>{m.elapsed+=dt;if(m.elapsed>=m.data.frameDurationsMs[m.index]){m.elapsed=0;m.index=(m.index+1)%4;paint(m);}});}requestAnimationFrame(loop);}
play.addEventListener('click',()=>setPlay(!playing));document.querySelector('#next').addEventListener('click',()=>{setPlay(false);models.forEach(m=>{m.index=(m.index+1)%4;m.elapsed=0;paint(m);});});document.querySelector('#size').addEventListener('click',e=>{const small=document.body.classList.toggle('small-mode');e.target.textContent=small?'恢复放大预览':'缩小预览 · 96 px';});document.addEventListener('visibilitychange',()=>{if(document.hidden)setPlay(false);});init().catch(error=>{const el=document.querySelector('#error');el.hidden=false;el.textContent=error.message;});
</script>
</html>

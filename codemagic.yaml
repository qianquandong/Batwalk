# Independent of GitHub Actions. All workflows are manual to conserve minutes.
# Use a personal Codemagic account and the M2 instance for the included free tier.
workflows:
  batwalk-watch-playground:
    name: Batwalk · Interactive Watch simulator
    instance_type: mac_mini_m2
    max_build_duration: 45
    # Manual, unsigned, no Apple integration or publishing steps.
    # Enable SSH/VNC access in the start-build dialog to use the desktop.
    environment:
      xcode: "26.3"
      vars:
        RUNNER_TEMP: /tmp/batwalk-playground-logs
        BATWALK_SESSION_MINUTES: "30"
    scripts:
      - name: Prepare Xcode and generate project
        script: bash scripts/codemagic-prepare.sh
      - name: Boot Watch simulator
        script: bash scripts/watch-sim.sh
      - name: Build Watch for hands-on testing
        script: |
          bash scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkWatch \
            -configuration Debug -destination "id=$SIM" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Open Batwalk and keep the simulator available for 30 minutes
        script: bash scripts/watch-playground.sh
    artifacts:
      - build/reports/toolchain.txt
      - build/reports/watch-simulator-ready.png
      - /tmp/batwalk-playground-logs/*.log

  batwalk-verify:
    name: Batwalk · Watch + iPhone checks
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "26.3"
      vars:
        RUNNER_TEMP: /tmp/batwalk-ci-logs
    scripts:
      - name: Prepare Xcode and generate project
        script: bash scripts/codemagic-prepare.sh
      - name: Run game-rule tests
        script: |
          set -euo pipefail
          swift test --package-path Packages/BatwalkCore 2>&1 | tee build/reports/core-tests.log
      - name: Test CI fallback detection
        script: python3 -m unittest discover -s scripts/tests -p 'test_github_ci_fallback.py'
      - name: Compile Watch app
        script: |
          bash scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkWatch \
            -configuration Debug -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Boot iPhone simulator
        script: bash scripts/phone-sim.sh
      - name: Build iPhone and run hosted app tests
        script: |
          bash scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkPhone \
            -configuration Debug -destination "platform=iOS Simulator,id=$PHONE_SIM" \
            -derivedDataPath build -resultBundlePath build/reports/AppTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Capture iPhone companion and handoff states
        script: |
          set -euo pipefail
          SIM="$PHONE_SIM" bash scripts/capture-screens.sh phone build/screens/phone
      - name: Switch to Watch simulator
        script: |
          set -euo pipefail
          xcrun simctl shutdown "$PHONE_SIM"
          bash scripts/watch-sim.sh
      - name: Build Watch for the selected simulator
        script: |
          bash scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkWatch \
            -configuration Debug -destination "id=$SIM" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Capture the three pilots and Friendship
        script: |
          set -euo pipefail
          for scenario in pilot-mochi pilot-sticky pilot-walker friendship-4 first-egg hatch-ready progress-61; do
            BATWALK_SCREEN_SCENARIO="$scenario" bash scripts/capture-screens.sh watch build/screens/watch
          done
          xcrun simctl shutdown "$SIM"
      - name: Compile optional capabilities without signing
        script: |
          set -euo pipefail
          python3 scripts/configure-capabilities.py --app-group --cloud-backup
          xcodegen generate --spec project.capabilities.json
          bash scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkPhone \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/capabilities CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/reports/toolchain.txt
      - build/reports/*.log
      - build/reports/*.xcresult
      - build/screens/watch/*.png
      - build/screens/phone/*.png
      - /tmp/batwalk-ci-logs/*.log

  batwalk-watch-screenshots:
    name: Batwalk · Watch screenshots only
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "26.3"
      vars:
        RUNNER_TEMP: /tmp/batwalk-ci-logs
    scripts:
      - name: Prepare Xcode and generate project
        script: bash scripts/codemagic-prepare.sh
      - name: Boot Watch simulator
        script: bash scripts/watch-sim.sh
      - name: Build Watch
        script: |
          bash scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkWatch \
            -configuration Debug -destination "id=$SIM" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Capture Watch scenarios
        script: |
          set -euo pipefail
          bash scripts/capture-screens.sh watch build/screens/watch
          xcrun simctl shutdown "$SIM"
    artifacts:
      - build/reports/toolchain.txt
      - build/screens/watch/*.png
      - /tmp/batwalk-ci-logs/*.log

  batwalk-testflight:
    name: Batwalk · TestFlight (iPhone + Watch)
    instance_type: mac_mini_m2
    max_build_duration: 45
    # This integration must be explicitly authorized and connected in Codemagic.
    integrations:
      app_store_connect: Batwalk TestFlight
    environment:
      xcode: "26.3"
      vars:
        APP_STORE_APPLE_ID: "6819895282"
        RUNNER_TEMP: /tmp/batwalk-testflight-logs
    scripts:
      - name: Check Apple access and select the next TestFlight build number
        script: bash scripts/codemagic-testflight-preflight.sh
      - name: Prepare Xcode and generate project
        script: bash scripts/codemagic-prepare.sh
      - name: Test game rules and release checks
        script: |
          set -euo pipefail
          swift test --package-path Packages/BatwalkCore 2>&1 | tee build/reports/core-tests.log
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Boot iPhone simulator
        script: bash scripts/phone-sim.sh
      - name: Test application reliability before archive
        script: |
          set -euo pipefail
          bash scripts/ci-xcodebuild.sh -project Batwalk.xcodeproj -scheme BatwalkPhone \
            -configuration Debug -destination "platform=iOS Simulator,id=$PHONE_SIM" \
            -derivedDataPath build -resultBundlePath build/reports/AppTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
          xcrun simctl shutdown "$PHONE_SIM"
      - name: Archive, inspect and upload iPhone plus Watch to TestFlight
        script: bash scripts/codemagic-testflight.sh
    artifacts:
      - build/reports/toolchain.txt
      - build/reports/*.log
      - build/reports/*.json
      - build/reports/*.plist
      - build/reports/*.xcresult
      - /tmp/batwalk-testflight-logs/*.log
    # Upload happens in the final gated script, using Xcode cloud signing.
    # There is no automatic App Store submission, external beta review or invite.
